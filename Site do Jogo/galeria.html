<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Galeria - ByteRise</title>
</head>

<body class="body">
    <nav>
        <div class="navbar">
            <a href="index.html" class="logo">ByteRise</a>
            <div class="nav-links">
                <a href="index.html" data-i18n="nav_inicio">Início</a>
                <a href="index.html#sobre" data-i18n="nav_sobre">Sobre</a>
                <a href="index.html#criadores" data-i18n="nav_criadores">Criadores</a>
                <a href="tutorial.html" data-i18n="nav_tutorial">Tutorial</a>
                <a href="galeria.html" data-i18n="nav_galeria" class="ativo">Galeria</a>
            </div>
            <div class="lang">
                <button data-lang="pt">PT</button>
                <button data-lang="en">EN</button>
                <button data-lang="es">ES</button>
            </div>
        </div>
    </nav>

    <main>
        <h1 class="titulo-pagina" data-i18n="titulo_galeria">Galeria</h1>

        <!-- sprites -->
        <section id="sprites">
            <h2 data-i18n="galeria_sprites">Sprites</h2>

            <div class="galeria-grid">
                <!-- quando tiver a imagem, troque o <span> por: <img src="img/sprite1.png" alt="Sprite 1">
                     e tire a classe "vazio" da div -->
                <div class="galeria-item vazio"><span>Imagem 1</span></div>
                <div class="galeria-item vazio"><span>Imagem 2</span></div>
                <div class="galeria-item vazio"><span>Imagem 3</span></div>
                <div class="galeria-item vazio"><span>Imagem 4</span></div>
                <div class="galeria-item vazio"><span>Imagem 5</span></div>
                <div class="galeria-item vazio"><span>Imagem 6</span></div>
            </div>
        </section>

        <!-- partes do codigo -->
        <section id="codigo">
            <h2 data-i18n="galeria_codigo">Código</h2>

            <div class="galeria-grid">
                <div class="galeria-item vazio"><span>Imagem 1</span></div>
                <div class="galeria-item vazio"><span>Imagem 2</span></div>
                <div class="galeria-item vazio"><span>Imagem 3</span></div>
                <div class="galeria-item vazio"><span>Imagem 4</span></div>
                <div class="galeria-item vazio"><span>Imagem 5</span></div>
                <div class="galeria-item vazio"><span>Imagem 6</span></div>
            </div>
        </section>

        <!-- espaco para novas categorias: copie uma das <section> acima, mude o id e o data-i18n do titulo -->
    </main>

    <footer>
        <p data-i18n="footer_direitos">2026 ByteRise. Todos os direitos reservados.</p>
        <p class="voltar-topo"><a href="#" data-i18n="footer_voltar_topo">Voltar ao topo</a></p>
    </footer>

    <!-- troca de tema -->
    <button id="troca-tema" aria-label="Trocar tema">&#9790;</button>
    <script src="script.js"></script>
</body>

</html>
